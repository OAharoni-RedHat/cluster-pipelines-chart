suite: Test aeg pipelines
templates:
  - templates/pipelines/standard-pipelines.yaml
release:
  name: release-test
tests:
  - it: should output correct amount of pipelines
    documentSelector:
      path: metadata.labels["pattern.name"]
      value: ansible-edge
      matchMany: true
    isKind:
      of: Pipeline
    asserts:
      - hasDocuments:
          count: 3 # (platform * versions * flavors)
          filterAware: true
