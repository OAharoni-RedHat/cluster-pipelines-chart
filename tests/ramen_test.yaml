suite: Test namespace with default values
templates:
  - templates/pipelines/standard-pipelines.yaml
release:
  name: release-test
tests:
  - it: should output when defined as list
    documentSelector:
      path: metadata.labels["pattern.name"]
      value: ramen
      matchMany: true
    isKind:
      of: Pipeline
    asserts:
      - hasDocuments:
          count: 3 # 1 * 3 * 1  (platform * versions * flavors) (only aws and multi-dr)
          filterAware: true
