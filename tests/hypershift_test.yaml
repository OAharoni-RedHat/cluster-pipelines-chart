suite: Test hypershift pipelines
templates:
  - templates/pipelines/standard-pipelines.yaml
release:
  name: release-test
tests:
  - it: should output correct amount of pipelines
    documentSelector:
      path: metadata.labels["pattern.name"]
      value: hypershift
      matchMany: true
    isKind:
      of: Pipeline
    asserts:
      - hasDocuments:
          count: 12
          filterAware: true
