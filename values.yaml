pipelineNamespace: cluster-provisioning

# Hub pattern may pass clusterGroup (namespaces, applications) for conditional behavior.
clusterGroup: {}

# klusterletAddon.enabled: explicit true/false overrides auto-detection below.
# When unset, create-klusterlet-addon runs only if clusterGroup lists ACM or the OCM namespace.
klusterletAddon: {}

serviceAccount:
  create: true
  name: provisioner
  namespace: cluster-provisioning

toolsImage: image-registry.openshift-image-registry.svc:5000/openshift/tools
# Built by the hcp-cli chart and pushed to the internal registry
hcpImage: image-registry.openshift-image-registry.svc:5000/cluster-provisioning/hcp-cli:latest
awsCliImage: amazon/aws-cli:latest

externalSecrets:
  secretStore:
    name: vault-backend
    kind: ClusterSecretStore
  awsCreds:
    key: secret/data/hub/aws
  gcpCreds:
    key: secret/data/hub/gcp
  azureCreds:
    key: secret/data/hub/azure
  pullSecret:
    key: pushsecrets/global-pull-secret

hypershift:
  defaultReplicas: 2
  defaultInstanceType: m5.xlarge
  baseDomain: ""
  # Namespace of HostedCluster / NodePool CRs on the hub (OpenShift + HyperShift default).
  hostedClusterNamespace: clusters
  # destroy: finalizer task treats empty cluster-data-namespace as "cluster-<cluster-name>" on the hub.

hive:
  defaultControlPlaneReplicas: "3"
  defaultWorkerReplicas: "3"

global:
  hubClusterDomain: apps.hcp.aws.validatedpatterns.io

qeCIPipelines:
  defaults:
    namespace: vp-qe-ci
    platforms:
      aws:
        region: us-east-1
        baseDomain: aws.validatedpatterns.io
        controlPlaneIAMRole: vp-ocp-ControlPlane-Role
        computeNodeIAMRole: vp-ocp-Worker-Role
        credentialName: qe-ci-aws-creds
      gcp:
        region: us-central1
        baseDomain: gcp.validatedpatterns.io
        projectId: rh-patterns
        credentialName: qe-ci-gcp-creds
      azure:
        region: westus3
        baseDomain: azure.validatedpatterns.io
        baseDomainResourceGroup: os4-common
        credentialName: qe-ci-azure-creds
    ocp_versions:
      - "4.20"
      - "4.21"
      - "4.22"
    flavors: # These are the pipeline "types"
      # List form: [single, multi] — clusterGroup defaults to hub;
      # override with map form, e.g. single: { clusterGroup: standalone }
      # sets TARGET_CLUSTERGROUP during install and test time
      single: # This will be a hive made regular single cluster
        clusterGroup: hub
      multi: # This will be a hive made regular hub and spoke cluster
        clusterGroup: hub
      hosted: # This will be just a single hub cluster setup with hcp hosted clusters
        clusterGroup: hub
        platforms: # Only aws supports hosted cluster deployments
          - aws
    networking:
      networkType: OVNKubernetes
      clusterNetwork:
        - cidr: 10.128.0.0/14
          hostPrefix: 23
      machineNetwork:
        - cidr: 10.0.0.0/16
      serviceNetwork:
        - 172.30.0.0/16
    mustGatherImg: quay.io/validatedpatterns/must-gather
    utilityContainerImg: quay.io/validatedpatterns/utility-container
    # Tekton per-task timeout for provision-* pipeline tasks (oc wait on clusterdeployment/hostedcluster).
    provisionTaskTimeout: 2h
    hcpARN: arn:aws:iam::296267305927:role/hypershift_cli_role
    ciBucket: vp-qe-ci-badges
    mustGatherBucket: vp-qe-ci-must-gathers
  patterns:
    # These are the maintained tier
    mcg:
      repo: https://github.com/validatedpatterns/multicloud-gitops.git
      flavors:
        single:
          clusterGroup: standalone
        multi:
        hosted:
          clusterGroup: standalone
    ansible-edge:
      repo: https://github.com/darkdoc/ansible-edge-gitops.git
      platforms: #if empty, or unset it will be the defaults.platforms
        aws:
      flavors:
        single:
      # Pre-created Secrets in qeCIPipelines.defaults.namespace;
      # workspace name matches secret name (underscores become hyphens). Bind each at PipelineRun / in UI.
      secrets:
        - aeg-secret-values-file # oc create secret generic aeg-secret-values-file  -n vp-qe-ci --from-file=values-secret.yaml=aeg-qe-values-secret.yaml
        - aeg-aap-manifest-file # oc create secret generic aeg-aap-manifest-file -n vp-qe-ci --from-file=aap_manifest.zip=/home/aeros/Downloads/manifest_vp-aeros_20260709T084257Z.zip
        - aeg-aap-ssh-file # oc create secret generic aeg-aap-ssh-file -n vp-qe-ci --from-file=id_rsa=aeg-qe-ssh --from-file=id_rsa.pub=aeg-qe-ssh.pub

    ramen:
      repo: https://github.com/validatedpatterns/ramendr-starter-kit.git
      revision: main
      ocp_versions:
        - "4.20"
        - "4.22"
      # ACM ManagedCluster names for the two DR spokes.
      # These MUST match clusterOverrides.primary.name / secondary.name in
      # the pattern's values-cluster-names.yaml so that ACM policies (CA bundle,
      # DRCluster placement) select the right clusters.
      spokePrimaryAcmName: ocp-primary
      spokeSecondaryAcmName: ocp-secondary
      platforms:
        aws:
          # Per-cluster region overrides for the multi-dr flavor.
          # Hub uses the default region (us-east-1).
          # Spokes must be in different regions for meaningful DR.
          spokePrimaryRegion: us-west-1
          spokeSecondaryRegion: us-east-2
      # Per-cluster networking CIDRs for the multi-dr flavor.
      # Each role must use non-overlapping ranges for Submariner and ODF replication.
      # Falls back to qeCIPipelines.defaults.networking.multiDr if unset.
      networking:
        hub:
          clusterNetworkCidr: 10.128.0.0/14
          clusterHostPrefix: 23
          machineNetworkCidr: 10.0.0.0/16
          serviceNetworkCidr: 172.30.0.0/16
        spokePrimary:
          clusterNetworkCidr: 10.132.0.0/14
          clusterHostPrefix: 23
          machineNetworkCidr: 10.1.0.0/16
          serviceNetworkCidr: 172.31.0.0/16
        spokeSecondary:
          clusterNetworkCidr: 10.136.0.0/14
          clusterHostPrefix: 23
          machineNetworkCidr: 10.2.0.0/16
          serviceNetworkCidr: 172.32.0.0/16
      flavors:
        multi-dr:
          clusterGroup: odf
      secrets:
        - ramendr-secret-values-file

    # industrial-edge:
    #   repo: https://github.com/validatedpatterns/industrial-edge.git
    #   flavors:
    #     - multi
    #   secrets:
    #     - industrial-edge-secret-values-file

    # medical-diag:
    #   repo: https://github.com/validatedpatterns/medical-diagnosis.git
    #   flavors:
    #     - single

    # These are the tested tier
    layered-zero:
      repo: https://github.com/darkdoc/layered-zero-trust.git
      revision: pipeline_test
      flavors:
        single:
          clusterGroup: ci

    # travelops:
    #   repo: https://github.com/validatedpatterns/travelops.git
    #   flavors:
    #     - single

    # hypershift:
    #   repo: https://github.com/validatedpatterns-sandbox/hypershift
    #   flavors:
    #     - hosted
    #     - single

    # ragllm:
    #   platforms:
    #     aws:
    #   flavors:
    #     single:

  scheduleDefaults:
    suspend: false
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    workspaceStorage: 1Gi
    timeout: 3h
    taskTimeout: 2h
    finallyTimeout: 30m
    # triggerImage: registry.redhat.io/openshift4/ose-cli:latest

  # Each entry creates a CronJob that starts a PipelineRun for an existing pipeline.
  # cron schedules are started on UTC times
  schedules:
    # TODO these are running on a weekly sched. instead of bi-weekly/monthly for the transitioning phase

    ## MCG
    - pipeline: mcg-aws-4-22-multi # H 7 * * 1 %SOLUTION_DEFINITION=mcgitops-aws-ocp4.22
      cron: "0 6 * * 4" # Thu 6:00 UTC
    - pipeline: mcg-aws-4-21-multi # H 10 * * 1 %SOLUTION_DEFINITION=mcgitops-aws-ocp4.21
      cron: "0 6 * * 4" # Thu 6:00 UTC
    - pipeline: mcg-azure-4-20-multi # H 6 * * 1 %SOLUTION_DEFINITION=mcgitops-azure-ocp4.20
      cron: "0 7 * * 4" # Thu 7:00 UTC
    - pipeline: mcg-gcp-4-21-multi # # H 4 1 * * %SOLUTION_DEFINITION=mcgitops-gcp-ocp4.21
      cron: "0 7 * * 4" # Thu 7:00 UTC

    ## MCG - STANDALONE
    - pipeline: mcg-aws-4-20-single # H 4 5 * * %SOLUTION_DEFINITION=mcgitopsstandalone-aws-ocp4.22
      cron: "0 8 * * 4" # Thu 8:00 UTC
    - pipeline: mcg-aws-4-21-single # H 4 6 * * %SOLUTION_DEFINITION=mcgitopsstandalone-aws-ocp4.21
      cron: "0 8 * * 4" # Thu 8:00 UTC
    - pipeline: mcg-aws-4-22-single # # H 4 7 * * %SOLUTION_DEFINITION=mcgitopsstandalone-aws-ocp4.20
      cron: "0 9 * * 4" # Thu 9:00 UTC

    ## MCG - HCP
    - pipeline: mcg-aws-4-20-hosted # H 4 15 * * %SOLUTION_DEFINITION=mcgitopshcp-aws-ocp4.20
      cron: "0 9 * * 4" # Thu 9:00 UTC
    - pipeline: mcg-aws-4-21-hosted # H 4 16 * * %SOLUTION_DEFINITION=mcgitopshcp-aws-ocp4.21
      cron: "0 10 * * 4" # Thu 10:00 UTC
    - pipeline: mcg-aws-4-22-hosted # H 4 17 * * %SOLUTION_DEFINITION=mcgitopshcp-aws-ocp4.22
      cron: "0 10 * * 4" # Thu 10:00 UTC

    ## Ansible Edge
    - pipeline: ansible-edge-aws-4-20-single # H 9 * * 2 %SOLUTION_DEFINITION=aegitops-aws-ocp4.20
      cron: "0 6 * * 5" # Fri 6:00 UTC
    - pipeline: ansible-edge-aws-4-21-single # H 10 * * 2 %SOLUTION_DEFINITION=aegitops-aws-ocp4.21
      cron: "0 6 * * 5" # Fri 6:00 UTC
    - pipeline: ansible-edge-aws-4-22-single # H 14 * * 2 %SOLUTION_DEFINITION=aegitops-aws-ocp4.22
      cron: "0 7 * * 5" # Fri 7:00 UTC
