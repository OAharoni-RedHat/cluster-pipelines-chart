    #   cron: "0 6 * * 3" # Wed 6:00 UTC
    #   timeout: 4h
    #   taskTimeout: 3h
    #   finallyTimeout: 30m
    # - pipeline: ansible-edge-aws-4-20-single
    #   cron: "0 6 * * 5" # Fri 6:00 UTC
    #   timeout: 4h
    #   taskTimeout: 3h
    #   finallyTimeout: 30m
    # - pipeline: layered-zero-aws-4-21-single
    #   cron: "0 6 * * 2" # Tue 6:00 UTC
    #   timeout: 4h
    #   taskTimeout: 3h
    #   finallyTimeout: 30m
    # - pipeline: ansible-edge-aws-4-21-single
    #   cron: "0 3 * * 0"
