# One global pullsecret overall
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: global-pullsecret
  namespace: {{ .Values.pipelineNamespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: global-pullsecret
    creationPolicy: Owner
  data:
  - secretKey: .dockerconfigjson
    remoteRef:
      key: pushsecrets/global-pull-secret
      property: docker

