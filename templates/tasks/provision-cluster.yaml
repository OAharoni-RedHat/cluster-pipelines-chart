apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: provision-cluster
  namespace: {{ .Values.pipelineNamespace }}
  labels:
    {{- include "pipelines.labels" . | nindent 4 }}
spec:
  description: >
    Provision a cluster via Hive deploy.
  params:
    - name: cluster-base-name
      type: string
      default: ""
    - name: namespace
      type: string
      default: {{ .Values.pipelineNamespace }}
    - name: cluster-role
      type: string
      default: hub
    - name: flavor
      type: string
      default: standalone
    - name: platform
      type: string
      default: ""
    - name: ocp-version
      type: string
      default: ""
    - name: wait-timeout-minutes
      type: string
      default: "90"
    - name: ssh-public-key
      type: string
      default: ""
    - name: control-plane-config
      type: object
      properties:
        replicas:
          type: string
          default: "0"
        type:
          type: string
          default: ""
    - name: compute-nodes-config
      type: object
      properties:
        replicas:
          type: string
          default: "0"
        type:
          type: string
          default: ""

  results:
    - name: cluster-name
      description: The name of the cluster created
  workspaces:
    - name: kubeconfig
    - name: install-config
      description: Holds generated install-config.yaml and clusterdeployment.yaml
  steps:
    - name: generate-install-config
      image: {{ .Values.toolsImage }}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        VERSION_STRING="$(params.ocp-version)"
        VERSION_STRING="${VERSION_STRING//./-}"
        CLUSTER_NAME="$(params.cluster-base-name)-$(params.platform)-${VERSION_STRING}-$(params.cluster-role)-$(params.flavor)"
        echo -n ${CLUSTER_NAME} > $(results.cluster-name.path)
        PLATFORM="$(params.platform)"

        CP_REPLICAS="$(params.control-plane-config.replicas)"
        CP_TYPE="$(params.control-plane-config.type)"

        WORKER_REPLICAS="$(params.compute-nodes-config.replicas)"
        WORKER_TYPE="$(params.compute-nodes-config.type)"
        SSH_KEY="$(params.ssh-public-key)"
        INSTALL_CFG="$(workspaces.install-config.path)/install-config.yaml"


        case "${PLATFORM}" in
        {{- range $name, $cfg := .Values.pipelines.defaults.platforms }}
          {{ $name }})
            BASE_DOMAIN={{ $cfg.baseDomain | quote }}
            CLOUD_REGION={{ $cfg.region | quote }}
            {{- if eq $name "gcp" }}
            GCP_PROJECT={{ default "" $cfg.projectId | quote }}
            {{- end }}
            {{- if eq $name "azure" }}
            AZ_RG={{ default "" $cfg.resourceGroup | quote }}
            {{- end }}
            ;;
        {{- end }}
          *)
            echo "unsupported platform: ${PLATFORM}" >&2
            exit 1
            ;;
        esac

        mkdir -p "$(workspaces.install-config.path)"

        cat > "${INSTALL_CFG}" <<EOF
        apiVersion: v1
        baseDomain: ${BASE_DOMAIN}
        compute:
        - architecture: amd64
          hyperthreading: Enabled
          name: worker
          replicas: ${WORKER_REPLICAS}
          platform:
            ${PLATFORM}:
              type: ${WORKER_TYPE}
        controlPlane:
          architecture: amd64
          hyperthreading: Enabled
          name: master
          replicas: ${CP_REPLICAS}
          platform:
            ${PLATFORM}:
              type: ${CP_TYPE}
        metadata:
          name: ${CLUSTER_NAME}
        networking:
          clusterNetwork:
          - cidr: {{ (index .Values.pipelines.defaults.networking.clusterNetwork 0).cidr }}
            hostPrefix: {{ (index .Values.pipelines.defaults.networking.clusterNetwork 0).hostPrefix }}
          machineNetwork:
          - cidr: {{ (index .Values.pipelines.defaults.networking.machineNetwork 0).cidr }}
          networkType: {{ .Values.pipelines.defaults.networking.networkType }}
          serviceNetwork:
          - {{ index .Values.pipelines.defaults.networking.serviceNetwork 0 }}
        pullSecret: ""
        platform:
        EOF

        case "${PLATFORM}" in
          aws)
            cat >> "${INSTALL_CFG}" <<EOF
          aws:
            region: ${CLOUD_REGION}
        EOF
            ;;
          gcp)
            cat >> "${INSTALL_CFG}" <<EOF
          gcp:
            projectID: ${GCP_PROJECT}
            region: ${CLOUD_REGION}
        EOF
            ;;
          azure)
            cat >> "${INSTALL_CFG}" <<EOF
          azure:
            baseDomainResourceGroupName: ${AZ_RG}
            cloudName: AzurePublicCloud
            region: ${CLOUD_REGION}
        EOF
            ;;
        esac

        if [ -n "${SSH_KEY}" ]; then
          printf '\nsshKey: |-\n' >> "${INSTALL_CFG}"
          printf '%s\n' "${SSH_KEY}" | sed 's/^/  /' >> "${INSTALL_CFG}"
        fi

        echo "Generated install-config for ${CLUSTER_NAME}:"
        cat "${INSTALL_CFG}"

    - name: apply-install-config
      image: {{ .Values.toolsImage }}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        VERSION_STRING="$(params.ocp-version)"
        VERSION_STRING="${VERSION_STRING//./-}"
        CLUSTER_NAME="$(params.cluster-base-name)-$(params.platform)-${VERSION_STRING}-$(params.cluster-role)-$(params.flavor)"

        INSTALL_CFG="$(workspaces.install-config.path)/install-config.yaml"

        oc create secret generic "${CLUSTER_NAME}-install-config" \
          -n "$(params.namespace)" \
          --from-file=install-config.yaml="${INSTALL_CFG}" \
          --dry-run=client -o yaml | oc apply -f -


    - name: generate-clusterdeployment
      image: {{ .Values.toolsImage }}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        VERSION_STRING="$(params.ocp-version)"
        VERSION_STRING="${VERSION_STRING//./-}"
        CLUSTER_NAME="$(params.cluster-base-name)-$(params.platform)-${VERSION_STRING}-$(params.cluster-role)-$(params.flavor)"
        NAMESPACE="$(params.namespace)"
        PLATFORM="$(params.platform)"
        OCP_VERSION="$(params.ocp-version)"
        OUT="$(workspaces.install-config.path)/clusterdeployment.yaml"

        case "${PLATFORM}" in
        {{- range $name, $cfg := .Values.pipelines.defaults.platforms }}
          {{ $name }})
            BASE_DOMAIN={{ $cfg.baseDomain | quote }}
            CLOUD_REGION={{ $cfg.region | quote }}
            {{- if eq $name "azure" }}
            AZ_RG={{ default "" $cfg.resourceGroup | quote }}
            {{- end }}
            ;;
        {{- end }}
          *)
            echo "unsupported platform: ${PLATFORM}" >&2
            exit 1
            ;;
        esac

        case "${OCP_VERSION}" in
        {{- range $ver, $img := .Values.pipelines.imageSets }}
          {{ $ver }})
            IMAGE_SET={{ $img | quote }}
            ;;
        {{- end }}
          *)
            echo "unsupported ocp-version: ${OCP_VERSION}" >&2
            exit 1
            ;;
        esac

        case "${PLATFORM}" in
          aws) CLOUD_LABEL="AWS" ;;
          gcp) CLOUD_LABEL="GCP" ;;
          azure) CLOUD_LABEL="Azure" ;;
        esac

        cat > "${OUT}" <<EOF
        apiVersion: hive.openshift.io/v1
        kind: ClusterDeployment
        metadata:
          name: ${CLUSTER_NAME}
          namespace: ${NAMESPACE}
          labels:
            cloud: ${CLOUD_LABEL}
            region: ${CLOUD_REGION}
            vendor: OpenShift
            cluster.open-cluster-management.io/clusterset: default
          annotations:
            hive.openshift.io/delete-after: "8h"
        spec:
          clusterName: ${CLUSTER_NAME}
          baseDomain: ${BASE_DOMAIN}
          installAttemptsLimit: 1
          provisioning:
            installConfigSecretRef:
              name: ${CLUSTER_NAME}-install-config
            imageSetRef:
              name: ${IMAGE_SET}
          pullSecretRef:
            name: global-pullsecret
          platform:
        EOF

        case "${PLATFORM}" in
          aws)
            cat >> "${OUT}" <<EOF
            aws:
              credentialsSecretRef:
                name: aws-creds
              region: ${CLOUD_REGION}
        EOF
            ;;
          gcp)
            cat >> "${OUT}" <<EOF
            gcp:
              credentialsSecretRef:
                name: gcp-creds
        EOF
            ;;
          azure)
            cat >> "${OUT}" <<EOF
            azure:
              credentialsSecretRef:
                name: azure-creds
              baseDomainResourceGroupName: ${AZ_RG}
              cloudName: AzurePublicCloud
        EOF
            ;;
        esac

        echo "Generated ClusterDeployment ${CLUSTER_NAME}:"
        cat "${OUT}"

    - name: apply-clusterdeployment
      image: {{ .Values.toolsImage }}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        OUT="$(workspaces.install-config.path)/clusterdeployment.yaml"

        if [ ! -f "${OUT}" ]; then
          echo "missing ClusterDeployment manifest: ${OUT}" >&2
          exit 1
        fi
        cat "${OUT}"

        oc apply -f "${OUT}"

    - name: wait-clusterdeployment-ready
      image: {{ .Values.toolsImage }}
      script: |
        #!/bin/bash
        set -euo pipefail


        CLUSTER_NAME=$(cat $(results.cluster-name.path))
        TIMEOUT=$(params.wait-timeout-minutes)
        TIMEOUT_SECS=$((TIMEOUT * 60))

        echo "Waiting up to ${TIMEOUT}m for ClusterDeployment ${CLUSTER_NAME} to be provisioned..."

        oc wait clusterdeployment/"${CLUSTER_NAME}" \
          -n "$(params.namespace)" \
          --for=condition=Ready=True \
          --timeout="${TIMEOUT_SECS}s"

        echo "Cluster provisioned successfully"

    - name: export-kubeconfig
      image: {{ .Values.toolsImage }}
      script: |
        #!/bin/bash
        set -euo pipefail

        # Extract admin kubeconfig
        CLUSTER_NAME=$(cat $(results.cluster-name.path))

        KUBECONFIG_SECRET=$(oc get clusterdeployment "${CLUSTER_NAME}" \
          -n "$(params.namespace)" \
          -o jsonpath='{.spec.clusterMetadata.adminKubeconfigSecretRef.name}' 2>/dev/null || echo "")

        if [ -z "$KUBECONFIG_SECRET" ]; then
          KUBECONFIG_SECRET="${CLUSTER_NAME}-0-admin-kubeconfig"
        fi

        echo "Extracting kubeconfig from secret ${KUBECONFIG_SECRET}"
        oc get secret "${KUBECONFIG_SECRET}" \
          -n "$(params.namespace)" \
          -o jsonpath='{.data.kubeconfig}' | base64 -d > $(workspaces.kubeconfig.path)/${CLUSTER_NAME}-kubeconfig

        # Extract admin password if available
        PASSWORD_SECRET=$(oc get clusterdeployment "${CLUSTER_NAME}" \
          -n "$(params.namespace)" \
          -o jsonpath='{.spec.clusterMetadata.adminPasswordSecretRef.name}' 2>/dev/null || echo "")

        if [ -n "$PASSWORD_SECRET" ]; then
          oc get secret "${PASSWORD_SECRET}" \
          -n "$(params.namespace)" \
          -o jsonpath='{.data.password}' | base64 -d > $(workspaces.kubeconfig.path)/${CLUSTER_NAME}-admin-password 2>/dev/null || true
        fi

        # Print cluster info
        API_URL=$(oc get clusterdeployment "${CLUSTER_NAME}" \
          -n "$(params.namespace)" \
          -o jsonpath='{.status.apiURL}' 2>/dev/null || echo "pending")
        CONSOLE_URL=$(oc get clusterdeployment "${CLUSTER_NAME}" \
          -n "$(params.namespace)" \
          -o jsonpath='{.status.webConsoleURL}' 2>/dev/null || echo "pending")

        echo "============================================"
        echo "Cluster: ${CLUSTER_NAME}"
        echo "API URL: ${API_URL}"
        echo "Console: ${CONSOLE_URL}"
        echo "Kubeconfig: $(workspaces.kubeconfig.path)/${CLUSTER_NAME}-kubeconfig"
        echo "============================================"
