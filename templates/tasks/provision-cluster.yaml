apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: provision-cluster
  namespace: {{ .Values.pipelineNamespace }}
  labels:
    {{- include "pipelines.labels" . | nindent 4 }}
spec:
  description: >
    Provision a cluster via Hive deploy.
  params:
    - name: cluster-name
      type: string
      default: ""
    - name: namespace
      type: string
      default: {{ .Values.pipelineNamespace }}
    - name: platform
      type: string
      default: ""
    - name: ocp-version
      type: string
      default: ""
    - name: wait-timeout-minutes
      type: string
      default: "90"
    - name: ssh-public-key
      type: string
      default: ""
    - name: control-plane-config
      type: object
      properties:
        replicas:
          type: string
          default: "0"
        type:
          type: string
          default: ""
    - name: compute-nodes-config
      type: object
      properties:
        replicas:
          type: string
          default: "0"
        type:
          type: string
          default: ""

  workspaces:
    - name: kubeconfig
    - name: install-config
      description: Holds generated install-config.yaml
  steps:
    - name: generate-install-config
      image: {{ .Values.toolsImage }}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        CLUSTER_NAME="$(params.cluster-name)"

        PLATFORM="$(params.platform)"

        CP_REPLICAS="$(params.control-plane-config.replicas)"
        CP_TYPE="$(params.control-plane-config.type)"

        WORKER_REPLICAS="$(params.compute-nodes-config.replicas)"
        WORKER_TYPE="$(params.compute-nodes-config.type)"
        SSH_KEY="$(params.ssh-public-key)"
        OUT="$(workspaces.install-config.path)/install-config.yaml"


        case "${PLATFORM}" in
        {{- range $name, $cfg := .Values.pipelines.defaults.platforms }}
          {{ $name }})
            BASE_DOMAIN={{ $cfg.baseDomain | quote }}
            CLOUD_REGION={{ $cfg.region | quote }}
            {{- if eq $name "gcp" }}
            GCP_PROJECT={{ default "" $cfg.projectId | quote }}
            {{- end }}
            {{- if eq $name "azure" }}
            AZ_RG={{ default "" $cfg.resourceGroup | quote }}
            {{- end }}
            ;;
        {{- end }}
          *)
            echo "unsupported platform: ${PLATFORM}" >&2
            exit 1
            ;;
        esac

        mkdir -p "$(workspaces.install-config.path)"

        cat > "${OUT}" <<EOF
        apiVersion: v1
        baseDomain: ${BASE_DOMAIN}
        compute:
        - architecture: amd64
          hyperthreading: Enabled
          name: worker
          replicas: ${WORKER_REPLICAS}
          platform:
            ${PLATFORM}:
              type: ${WORKER_TYPE}
        controlPlane:
          architecture: amd64
          hyperthreading: Enabled
          name: master
          replicas: ${CP_REPLICAS}
          platform:
            ${PLATFORM}:
              type: ${CP_TYPE}
        metadata:
          name: ${CLUSTER_NAME}
        networking:
          clusterNetwork:
          - cidr: {{ (index .Values.pipelines.defaults.networking.clusterNetwork 0).cidr }}
            hostPrefix: {{ (index .Values.pipelines.defaults.networking.clusterNetwork 0).hostPrefix }}
          machineNetwork:
          - cidr: {{ (index .Values.pipelines.defaults.networking.machineNetwork 0).cidr }}
          networkType: {{ .Values.pipelines.defaults.networking.networkType }}
          serviceNetwork:
          - {{ index .Values.pipelines.defaults.networking.serviceNetwork 0 }}
        pullSecret: ""
        platform:
        EOF

        case "${PLATFORM}" in
          aws)
            cat >> "${OUT}" <<EOF
          aws:
            region: ${CLOUD_REGION}
        EOF
            ;;
          gcp)
            cat >> "${OUT}" <<EOF
          gcp:
            projectID: ${GCP_PROJECT}
            region: ${CLOUD_REGION}
        EOF
            ;;
          azure)
            cat >> "${OUT}" <<EOF
          azure:
            baseDomainResourceGroupName: ${AZ_RG}
            cloudName: AzurePublicCloud
            region: ${CLOUD_REGION}
        EOF
            ;;
        esac

        if [ -n "${SSH_KEY}" ]; then
          printf '\nsshKey: |-\n' >> "${OUT}"
          printf '%s\n' "${SSH_KEY}" | sed 's/^/  /' >> "${OUT}"
        fi

        echo "Generated install-config for ${CLUSTER_NAME}:"
        cat "${OUT}"

    - name: create-hive-cluster
      image: {{ .Values.toolsImage }}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        # TODO: namespace, externalsecrets, install-config secret, clusterdeployment, wait
        echo "TODO: apply Hive resources for $(params.cluster-name) in namespace $(params.namespace)"
        echo "  platform=$(params.platform) ocp-version=$(params.ocp-version)"
        echo "  timeout=$(params.wait-timeout-minutes)m"
        echo "  install-config: $(workspaces.install-config.path)/install-config.yaml"
        exit 1