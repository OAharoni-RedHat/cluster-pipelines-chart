apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: provision-cluster
  namespace: {{ .Values.pipelineNamespace }}
  labels:
    {{- include "pipelines.labels" . | nindent 4 }}
spec:
  description: >
    Provision a cluster via Hive deploy.
  params:
    - name: cluster-name
      type: string
      default: ""
    - name: namespace
      type: string
      default: {{ .Values.pipelineNamespace }}
    - name: platform
      type: string
      default: ""
    - name: ocp-version
      type: string
      default: ""
    - name: wait-timeout-minutes
      type: string
      default: "90"
    - name: ssh-public-key
      type: string
      default: ""
    - name: control-plane-config
      type: object
      properties:
        replicas:
          type: string
          default: "0"
        type:
          type: string
          default: ""
    - name: compute-nodes-config
      type: object
      properties:
        replicas:
          type: string
          default: "0"
        type:
          type: string
          default: ""

  workspaces:
    - name: kubeconfig
    - name: install-config
      description: Holds generated install-config.yaml
  steps:
    - name: generate-install-config
      image: {{ .Values.toolsImage }}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        CLUSTER_NAME="$(params.cluster-name)"
        PLATFORM="$(params.platform)"
        CLOUD_PROVIDER="${PLATFORM}"
        CP_REPLICAS="$(params.control-plane-config.replicas)"
        CP_TYPE="$(params.control-plane-config.type)"
        WORKER_REPLICAS="$(params.compute-nodes-config.replicas)"
        WORKER_TYPE="$(params.compute-nodes-config.type)"
        SSH_KEY="$(params.ssh-public-key)"
        OUT="$(workspaces.install-config.path)/install-config.yaml"
        GCP_PROJECT=""
        AZ_RG=""

        case "${PLATFORM}" in
        {{ include "tasks.installConfig.platformEnvCase" . | nindent 8 }}
        esac

        mkdir -p "$(workspaces.install-config.path)"

        {{ include "tasks.installConfig.generateScript" . | nindent 8 }}

        echo "Generated install-config for ${CLUSTER_NAME}:"
        cat "${OUT}"

    - name: create-hive-cluster
      image: {{ .Values.toolsImage }}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        # TODO: namespace, externalsecrets, install-config secret, clusterdeployment, wait
        echo "TODO: apply Hive resources for $(params.cluster-name) in namespace $(params.namespace)"
        echo "  platform=$(params.platform) ocp-version=$(params.ocp-version)"
        echo "  timeout=$(params.wait-timeout-minutes)m"
        echo "  install-config: $(workspaces.install-config.path)/install-config.yaml"
        exit 1