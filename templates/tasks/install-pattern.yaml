apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: install-pattern
  namespace: {{ .Values.pipelineNamespace }}
  labels:
    {{- include "pipelines.labels" . | nindent 4 }}
spec:
  description: Install a validated pattern on the target cluster
  params:
    - name: application
      type: string
    - name: flavor
      type: string
    - name: clusterPool
      type: string
  workspaces:
    - name: pattern-repo
    - name: kubeconfig
  results:
    - name: outcome
  steps:
    - name: install-pattern
      image: quay.io/validatedpatterns/utility-container
      env:
        - name: KUBECONFIG
          value: $(workspaces.kubeconfig.path)/kubeconfig
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        trap 'echo -n failed > "$(results.outcome.path)"' ERR
        echo "TODO: real pattern install — mock success for now"
        echo "  application=$(params.application) flavor=$(params.flavor) pool=$(params.clusterPool)"
        echo -n success > "$(results.outcome.path)"
