{{- include "qeCIPipelines.validatePatternSecrets" . }}
{{- $maxSecrets := int (include "qeCIPipelines.maxPatternSecrets" .) }}
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: install-pattern
  namespace: {{ .Values.qeCIPipelines.defaults.namespace }}
  labels:
    {{- include "pipelines.labels" . | nindent 4 }}
spec:
  description: Install a validated pattern on the target cluster
  params:
    - name: cluster-name
      type: string
      default: ""
    - name: target-clustergroup
      type: string
      default: hub
    - name: spoke-primary-cluster-name
      type: string
      default: ""
      description: >
        Actual cluster name for the primary spoke (from provision step).
        When set together with spoke-secondary-cluster-name, their kubeconfigs
        are injected into values-secret.yaml before pattern install.
    - name: spoke-secondary-cluster-name
      type: string
      default: ""
      description: Actual cluster name for the secondary spoke (from provision step).
    - name: aws-creds-secret-name
      type: string
      default: ""
      description: >
        Name of an existing Kubernetes Secret in the pipeline namespace containing
        aws_access_key_id and aws_secret_access_key. When set, these credentials
        are injected into values-secret.yaml under the "aws" entry before pattern install.
    - name: spoke-primary-secret-name
      type: string
      default: "ocp-primary"
      description: >
        Vault secret key prefix for the primary spoke kubeconfig.
        Must match clusterOverrides.primary.name in the pattern values.
    - name: spoke-secondary-secret-name
      type: string
      default: "ocp-secondary"
      description: >
        Vault secret key prefix for the secondary spoke kubeconfig.
        Must match clusterOverrides.secondary.name in the pattern values.
  workspaces:
    - name: pattern-repo
    - name: kubeconfig
{{- range $i := until $maxSecrets }}
    - name: values-secret-{{ $i }}
      optional: true
{{- end }}
  results:
    - name: outcome
  steps:
    - name: install-pattern
      image: {{ .Values.qeCIPipelines.defaults.utilityContainerImg }}
      env:
        - name: KUBECONFIG
          value: $(workspaces.kubeconfig.path)/$(params.cluster-name)-kubeconfig
        - name: TARGET_CLUSTERGROUP
          value: $(params.target-clustergroup)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        # This is some workaround for Tekton injecting some KUBERNETES_* env vars
        unset KUBERNETES_SERVICE_HOST
        trap 'echo -n failed > $(results.outcome.path)' ERR

        # Copy secrets to home folder (they need to be referenced there in values-secrets.yaml)
        HOME_DIR="${HOME:-/tekton/home}"
        mkdir -p "${HOME_DIR}"
        WORKSPACES_ROOT="$(dirname "$(workspaces.pattern-repo.path)")"
        for dir in "${WORKSPACES_ROOT}"/*/; do
          [ -d "$dir" ] || continue
          name="$(basename "$dir")"
          case "$name" in
            pattern-repo|kubeconfig) continue ;;
          esac
          for f in "${dir}"*; do
            [ -f "$f" ] || continue
            dest="${HOME_DIR}/$(basename "$f")"
            echo "Copying ${f} -> ${dest}"
            cp "$f" "${dest}"
            chmod 600 "${dest}"
          done
        done

        # Inject spoke kubeconfigs into values-secret.yaml for BYOC multi-spoke patterns
        SPOKE_PRIMARY="$(params.spoke-primary-cluster-name)"
        SPOKE_SECONDARY="$(params.spoke-secondary-cluster-name)"
        if [ -n "${SPOKE_PRIMARY}" ] && [ -n "${SPOKE_SECONDARY}" ]; then
          PRIMARY_KC="$(workspaces.kubeconfig.path)/${SPOKE_PRIMARY}-kubeconfig"
          SECONDARY_KC="$(workspaces.kubeconfig.path)/${SPOKE_SECONDARY}-kubeconfig"
          PRIMARY_SECRET_NAME="$(params.spoke-primary-secret-name)_cluster_kubeconfig"
          SECONDARY_SECRET_NAME="$(params.spoke-secondary-secret-name)_cluster_kubeconfig"

          if [ ! -f "${PRIMARY_KC}" ] || [ ! -f "${SECONDARY_KC}" ]; then
            echo "ERROR: spoke kubeconfig(s) not found in workspace" >&2
            exit 1
          fi

          # Locate the values-secret file in HOME_DIR regardless of its exact filename.
          # The validated patterns framework expects ~/values-secret.yaml; create one if absent.
          VALUES_SECRET=$(find "${HOME_DIR}" -maxdepth 1 -name "*values-secret*" -type f | head -1)
          if [ -z "${VALUES_SECRET}" ]; then
            VALUES_SECRET="${HOME_DIR}/values-secret.yaml"
            echo "No values-secret file found in ${HOME_DIR}; creating ${VALUES_SECRET}"
            printf 'version: "2.0"\nsecrets: []\n' > "${VALUES_SECRET}"
          fi

          echo "Injecting spoke kubeconfigs into ${VALUES_SECRET}"
          printf '%s\n' \
            'import os, yaml' \
            'vs_path = os.environ["VS_PATH"]' \
            'primary_kc_path = os.environ["PRIMARY_KC_PATH"]' \
            'secondary_kc_path = os.environ["SECONDARY_KC_PATH"]' \
            'primary_name = os.environ["PRIMARY_NAME"]' \
            'secondary_name = os.environ["SECONDARY_NAME"]' \
            'with open(vs_path) as f:' \
            '    vs = yaml.safe_load(f) or {}' \
            'vs.setdefault("secrets", [])' \
            'vs["secrets"] = [s for s in vs["secrets"] if s.get("name") not in (primary_name, secondary_name)]' \
            'for name, kc_path in [(primary_name, primary_kc_path), (secondary_name, secondary_kc_path)]:' \
            '    with open(kc_path) as f:' \
            '        vs["secrets"].append({"name": name, "fields": [{"name": "kubeconfig", "value": f.read()}]})' \
            'with open(vs_path, "w") as f:' \
            '    yaml.dump(vs, f, default_flow_style=False, allow_unicode=True)' \
            'print("Injected:", primary_name, secondary_name)' \
            > /tmp/inject_kubeconfig.py
          VS_PATH="${VALUES_SECRET}" \
          PRIMARY_KC_PATH="${PRIMARY_KC}" \
          SECONDARY_KC_PATH="${SECONDARY_KC}" \
          PRIMARY_NAME="${PRIMARY_SECRET_NAME}" \
          SECONDARY_NAME="${SECONDARY_SECRET_NAME}" \
          python3 /tmp/inject_kubeconfig.py
        fi

        # Inject AWS credentials from an existing cluster secret into values-secret.yaml.
        # This avoids requiring the user to embed credentials in their values-secret file.
        AWS_CREDS_SECRET="$(params.aws-creds-secret-name)"
        if [ -n "${AWS_CREDS_SECRET}" ]; then
          VALUES_SECRET=$(find "${HOME_DIR}" -maxdepth 1 -name "*values-secret*" -type f | head -1)
          if [ -z "${VALUES_SECRET}" ]; then
            VALUES_SECRET="${HOME_DIR}/values-secret.yaml"
            printf 'version: "2.0"\nsecrets: []\n' > "${VALUES_SECRET}"
          fi
          echo "Injecting AWS credentials from secret ${AWS_CREDS_SECRET} into ${VALUES_SECRET}"
          AWS_KEY_ID=$(oc get secret "${AWS_CREDS_SECRET}" -n "$(context.taskRun.namespace)" \
            -o jsonpath='{.data.aws_access_key_id}' 2>/dev/null | base64 -d)
          AWS_SECRET=$(oc get secret "${AWS_CREDS_SECRET}" -n "$(context.taskRun.namespace)" \
            -o jsonpath='{.data.aws_secret_access_key}' 2>/dev/null | base64 -d)
          if [ -z "${AWS_KEY_ID}" ] || [ -z "${AWS_SECRET}" ]; then
            echo "WARNING: Could not read AWS credentials from secret ${AWS_CREDS_SECRET}, skipping injection"
          else
            printf '%s\n' \
              'import os, yaml' \
              'vs_path = os.environ["VS_PATH"]' \
              'key_id = os.environ["AWS_KEY_ID"]' \
              'secret = os.environ["AWS_SECRET"]' \
              'with open(vs_path) as f:' \
              '    vs = yaml.safe_load(f) or {}' \
              'vs.setdefault("secrets", [])' \
              'vs["secrets"] = [s for s in vs["secrets"] if s.get("name") != "aws"]' \
              'vs["secrets"].append({"name": "aws", "fields": [' \
              '    {"name": "aws_access_key_id", "value": key_id},' \
              '    {"name": "aws_secret_access_key", "value": secret},' \
              ']})' \
              'with open(vs_path, "w") as f:' \
              '    yaml.dump(vs, f, default_flow_style=False, allow_unicode=True)' \
              'print("Injected AWS credentials")' \
              > /tmp/inject_aws.py
            VS_PATH="${VALUES_SECRET}" \
            AWS_KEY_ID="${AWS_KEY_ID}" \
            AWS_SECRET="${AWS_SECRET}" \
            python3 /tmp/inject_aws.py
          fi
        fi

        cd $(workspaces.pattern-repo.path)

        ./pattern.sh make install

        # If we reach here, everything succeeded
        echo -n success > $(results.outcome.path)
