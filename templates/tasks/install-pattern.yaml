apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: install-pattern
  namespace: {{ .Values.pipelineNamespace }}
  labels:
    {{- include "pipelines.labels" . | nindent 4 }}
spec:
  description: Install a validated pattern on the target cluster
  params:
    - name: cluster-name
      type: string
      default: ""
    - name: target-clustergroup
      type: string
      default: hub
  workspaces:
    - name: pattern-repo
    - name: kubeconfig
  results:
    - name: outcome
  steps:
    - name: install-pattern
      image: {{ .Values.pipelines.defaults.utilityContainerImg }}
      env:
        - name: KUBECONFIG
          value: $(workspaces.kubeconfig.path)/$(params.cluster-name)-kubeconfig
        - name: TARGET_CLUSTERGROUP
          value: $(params.target-clustergroup)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        # This is some workaround for Tekton injecting some KUBERNETES_* env vars
        unset KUBERNETES_SERVICE_HOST
        trap 'echo -n failed > $(results.outcome.path)' ERR

        cd $(workspaces.pattern-repo.path)

        # Install the pattern

        ./pattern.sh make install

        # If we reach here, everything succeeded
        echo -n success > $(results.outcome.path)
