apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: delete-cluster
  namespace: {{ .Values.pipelineNamespace }}
  labels:
    {{- include "pipelines.labels" . | nindent 4 }}
spec:
  description: >
    Delete a cluster via Hive teardown.
  params:
    - name: cluster-name
      type: string
      default: ""
