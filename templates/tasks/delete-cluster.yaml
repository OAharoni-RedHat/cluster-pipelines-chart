apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: delete-cluster
  namespace: {{ .Values.pipelineNamespace }}
  labels:
    {{- include "pipelines.labels" . | nindent 4 }}
spec:
  description: >
    Delete a cluster via ClusterClaim or Hive teardown,
    selected at run time by useClusterPool.
  params:
    - name: useClusterPool
      type: string
    - name: clusterClaimName
      type: string
      default: ""
    - name: clusterClaimNamespace
      type: string
      default: ""
    - name: cluster-name
      type: string
      default: ""
    - name: application
      type: string
      default: ""
    - name: platform
      type: string
      default: ""
    - name: namespace
      type: string
      default: ""
    - name: cluster-role
      type: string
      default: "hub"
  steps:
    - name: delete-cluster-claim
      when:
        - input: "$(params.useClusterPool)"
          operator: in
          values: ["true"]
      image: {{ .Values.toolsImage }}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "TODO: delete ClusterClaim $(params.clusterClaimName) in $(params.clusterClaimNamespace)"
        # oc delete clusterclaim.hive.openshift.io/$(params.clusterClaimName) \
        #   -n $(params.clusterClaimNamespace) --ignore-not-found
    - name: delete-hive-cluster
      when:
        - input: "$(params.useClusterPool)"
          operator: in
          values: ["false"]
      image: {{ .Values.toolsImage }}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        # TODO: wire destroy-hive tasks (clusterdeployment delete, namespace cleanup, etc.)
        echo "TODO: delete Hive cluster $(params.cluster-name)"
        echo "  application=$(params.application) platform=$(params.platform) role=$(params.cluster-role)"
        echo "  namespace=$(params.namespace)"
