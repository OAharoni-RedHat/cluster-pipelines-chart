apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: interop-test
  namespace: {{ .Values.pipelineNamespace }}
  labels:
    {{- include "pipelines.labels" . | nindent 4 }}
spec:
  description: Run pattern interop tests
  params:
    - name: flavor
      type: string
    - name: test-edge
      type: string
      default: "false"
  workspaces:
    - name: pattern-repo
    - name: kubeconfig
    - name: test-results
  results:
    - name: outcome
  steps:
    - name: run-interop-pattern-test
      image: quay.io/validatedpatterns/utility-container
      env:
        - name: KUBECONFIG
          value: $(workspaces.kubeconfig.path)/kubeconfig
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        trap 'echo -n failed > "$(results.outcome.path)"' ERR
        echo "TODO: real interop tests — mock success for now"
        echo "  flavor=$(params.flavor) TEST_EDGE=$(params.test-edge)"
        echo -n success > "$(results.outcome.path)"
