apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: prepare-dr-secrets
  namespace: {{ .Values.pipelineNamespace }}
  labels:
    {{- include "pipelines.labels" . | nindent 4 }}
spec:
  description: >
    Prepare values-secret.yaml for a multi-DR pattern install by injecting
    provisioned spoke kubeconfigs and AWS credentials from the pipeline cluster.
    Writes a ready-to-use values-secret.yaml to the output workspace so that
    install-pattern can consume it without needing any flavor-specific logic.
  params:
    - name: spoke-primary-cluster-name
      type: string
      description: Cluster name of the primary spoke (used to locate its kubeconfig in the kubeconfig workspace).
    - name: spoke-secondary-cluster-name
      type: string
      description: Cluster name of the secondary spoke.
    - name: spoke-primary-secret-name
      type: string
      default: "ocp-primary"
      description: >
        Vault secret key prefix for the primary spoke kubeconfig.
        Must match clusterOverrides.primary.name in the pattern values.
    - name: spoke-secondary-secret-name
      type: string
      default: "ocp-secondary"
      description: >
        Vault secret key prefix for the secondary spoke kubeconfig.
        Must match clusterOverrides.secondary.name in the pattern values.
  workspaces:
    - name: kubeconfig
      description: Workspace containing provisioned cluster kubeconfigs written by provision-cluster tasks.
    - name: base-values-secret
      optional: true
      description: >
        Optional workspace containing a user-supplied values-secret.yaml (e.g. SSH keys,
        pull secrets, Vault config). Its contents are copied to the output workspace and
        then augmented with DR-specific entries.
    - name: output
      description: >
        Writable workspace where the fully prepared values-secret.yaml is written.
        Bind this to shared-data with subPath prepared-values-secret in the pipeline
        so install-pattern can mount it as values-secret-0.
  steps:
    - name: prepare-secrets
      image: {{ .Values.qeCIPipelines.defaults.utilityContainerImg }}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        OUTPUT_DIR="$(workspaces.output.path)"
        OUTPUT_FILE="${OUTPUT_DIR}/values-secret.yaml"

        # Start from the user-supplied base values-secret or create a minimal skeleton
        if [ "$(workspaces.base-values-secret.bound)" == "true" ]; then
          echo "Base workspace bound at: $(workspaces.base-values-secret.path)"
          echo "Workspace contents (including symlinks):"
          ls -la "$(workspaces.base-values-secret.path)/" || true
          BASE_FILE=$(find -L "$(workspaces.base-values-secret.path)" -maxdepth 1 -name "*values-secret*" -type f 2>/dev/null | head -1 || true)
          if [ -n "${BASE_FILE}" ]; then
            echo "Using base values-secret: ${BASE_FILE}"
            cp "${BASE_FILE}" "${OUTPUT_FILE}"
            echo "Secrets found in base file:"
            printf '%s\n' \
              'import os, yaml' \
              'vs = yaml.safe_load(open(os.environ["VS_PATH"])) or {}' \
              'secrets = vs.get("secrets", [])' \
              'names = ", ".join(s.get("name", "?") for s in secrets) or "(none)"' \
              'print(f"  {len(secrets)} secret(s): {names}")' \
              > /tmp/list_base_secrets.py
            VS_PATH="${OUTPUT_FILE}" python3 /tmp/list_base_secrets.py 2>&1 || true
          else
            echo "Base workspace bound but no values-secret file found; creating skeleton"
            printf 'version: "2.0"\nsecrets: []\n' > "${OUTPUT_FILE}"
          fi
        else
          echo "No base values-secret workspace bound; creating skeleton"
          printf 'version: "2.0"\nsecrets: []\n' > "${OUTPUT_FILE}"
        fi

        # Inject provisioned spoke kubeconfigs
        PRIMARY_KC="$(workspaces.kubeconfig.path)/$(params.spoke-primary-cluster-name)-kubeconfig"
        SECONDARY_KC="$(workspaces.kubeconfig.path)/$(params.spoke-secondary-cluster-name)-kubeconfig"
        PRIMARY_SECRET_NAME="$(params.spoke-primary-secret-name)_cluster_kubeconfig"
        SECONDARY_SECRET_NAME="$(params.spoke-secondary-secret-name)_cluster_kubeconfig"

        if [ ! -f "${PRIMARY_KC}" ] || [ ! -f "${SECONDARY_KC}" ]; then
          echo "ERROR: spoke kubeconfig(s) not found in kubeconfig workspace:" >&2
          echo "  primary:   ${PRIMARY_KC}" >&2
          echo "  secondary: ${SECONDARY_KC}" >&2
          exit 1
        fi

        echo "Injecting spoke kubeconfigs into ${OUTPUT_FILE}"
        printf '%s\n' \
          'import os, yaml' \
          'vs_path = os.environ["VS_PATH"]' \
          'primary_kc_path = os.environ["PRIMARY_KC_PATH"]' \
          'secondary_kc_path = os.environ["SECONDARY_KC_PATH"]' \
          'primary_name = os.environ["PRIMARY_NAME"]' \
          'secondary_name = os.environ["SECONDARY_NAME"]' \
          'with open(vs_path) as f:' \
          '    vs = yaml.safe_load(f) or {}' \
          'vs.setdefault("secrets", [])' \
          'vs["secrets"] = [s for s in vs["secrets"] if s.get("name") not in (primary_name, secondary_name)]' \
          'for name, kc_path in [(primary_name, primary_kc_path), (secondary_name, secondary_kc_path)]:' \
          '    with open(kc_path) as f:' \
          '        vs["secrets"].append({"name": name, "fields": [{"name": "kubeconfig", "value": f.read()}]})' \
          'with open(vs_path, "w") as f:' \
          '    yaml.dump(vs, f, default_flow_style=False, allow_unicode=True)' \
          'print("Injected:", primary_name, secondary_name)' \
          > /tmp/inject_kubeconfig.py
        VS_PATH="${OUTPUT_FILE}" \
        PRIMARY_KC_PATH="${PRIMARY_KC}" \
        SECONDARY_KC_PATH="${SECONDARY_KC}" \
        PRIMARY_NAME="${PRIMARY_SECRET_NAME}" \
        SECONDARY_NAME="${SECONDARY_SECRET_NAME}" \
        python3 /tmp/inject_kubeconfig.py

        # Inject AWS credentials from the pipeline cluster.
        # KUBECONFIG is not set here, so we use the in-cluster SA token explicitly
        # to reach the pipeline cluster API (not the provisioned hub).
        AWS_CREDS_SECRET="{{ .Values.qeCIPipelines.defaults.platforms.aws.credentialName }}"
        if [ -n "${AWS_CREDS_SECRET}" ]; then
          echo "Injecting AWS credentials from secret ${AWS_CREDS_SECRET}"
          SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          SA_CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          AWS_KEY_ID=$(oc get secret "${AWS_CREDS_SECRET}" -n "$(context.taskRun.namespace)" \
            --token="${SA_TOKEN}" --certificate-authority="${SA_CA}" --server="https://kubernetes.default.svc" \
            -o jsonpath='{.data.aws_access_key_id}' 2>/dev/null | base64 -d) || true
          AWS_SECRET=$(oc get secret "${AWS_CREDS_SECRET}" -n "$(context.taskRun.namespace)" \
            --token="${SA_TOKEN}" --certificate-authority="${SA_CA}" --server="https://kubernetes.default.svc" \
            -o jsonpath='{.data.aws_secret_access_key}' 2>/dev/null | base64 -d) || true
          if [ -z "${AWS_KEY_ID}" ] || [ -z "${AWS_SECRET}" ]; then
            echo "WARNING: Could not read AWS credentials from secret ${AWS_CREDS_SECRET}, skipping injection"
          else
            printf '%s\n' \
              'import os, yaml' \
              'vs_path = os.environ["VS_PATH"]' \
              'key_id = os.environ["AWS_KEY_ID"]' \
              'secret = os.environ["AWS_SECRET"]' \
              'with open(vs_path) as f:' \
              '    vs = yaml.safe_load(f) or {}' \
              'vs.setdefault("secrets", [])' \
              'vs["secrets"] = [s for s in vs["secrets"] if s.get("name") != "aws"]' \
              'vs["secrets"].append({"name": "aws", "fields": [' \
              '    {"name": "aws_access_key_id", "value": key_id},' \
              '    {"name": "aws_secret_access_key", "value": secret},' \
              ']})' \
              'with open(vs_path, "w") as f:' \
              '    yaml.dump(vs, f, default_flow_style=False, allow_unicode=True)' \
              'print("Injected AWS credentials")' \
              > /tmp/inject_aws.py
            VS_PATH="${OUTPUT_FILE}" \
            AWS_KEY_ID="${AWS_KEY_ID}" \
            AWS_SECRET="${AWS_SECRET}" \
            python3 /tmp/inject_aws.py
          fi
        fi

        echo "Final values-secret written to ${OUTPUT_FILE}:"
        printf '%s\n' \
          'import os, yaml' \
          'vs = yaml.safe_load(open(os.environ["VS_PATH"])) or {}' \
          'secrets = vs.get("secrets", [])' \
          'print(f"  {len(secrets)} secret(s) total:")' \
          'for s in secrets:' \
          '    name = s.get("name", "?")' \
          '    fields = [fd.get("name", "?") for fd in s.get("fields", [])]' \
          '    print(f"    - {name} (fields: {fields})")' \
          > /tmp/list_final_secrets.py
        VS_PATH="${OUTPUT_FILE}" python3 /tmp/list_final_secrets.py 2>&1 || true
