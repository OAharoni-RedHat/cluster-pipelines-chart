apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: slack-notify-failure
  namespace: {{ .Values.pipelineNamespace }}
  labels:
    {{- include "pipelines.labels" . | nindent 4 }}
spec:
  description: Notify Slack when a pipeline run fails
  params:
    - name: application
      type: string
    - name: flavor
      type: string
  steps:
    - name: slack-notify
      image: quay.io/validatedpatterns/utility-container
      script: |
        #!/usr/bin/env bash
        # TODO: Slack notification on failure
        echo "Pipeline failed for $(params.application) ($(params.flavor))"
